<!DOCTYPE html>
<html lang="ru" class="h-full">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <!-- iOS ignores the manifest's icons for "Add to Home Screen" and uses this one; it is
       opaque on purpose, because iOS renders transparency in a home-screen icon as black. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- No maximum-scale/user-scalable=no: that blocked pinch-to-zoom outright, which
       WCAG 1.4.4 requires be possible — a real barrier for anyone with low vision. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Personal Finance Tracker — An ultra-fast, aesthetically refined personal finance management application with Apple & macOS design aesthetics." />
  <!-- Launched from the home screen the app runs standalone: no address bar, no Safari
       toolbar. `apple-mobile-web-app-capable` is what iOS actually reads; the manifest's
       "display": "standalone" covers Android and desktop Chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Finance" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- Per-scheme so the status bar and browser chrome follow the app's own theme instead
       of being blue in a black interface. -->
  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>Finance — Personal Finance Tracker</title>
</head>

<body
  class="h-full bg-[#fbfbfd] text-[#1d1d1f] dark:bg-[#000000] dark:text-[#f5f5f7] antialiased selection:bg-blue-500/20 selection:text-blue-600 transition-colors duration-200">
  <div id="root" class="h-full"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
